<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Tally favicon: serif-italic "T" + barcode glyph on cream paper.
       Geometry is hand-vectored (no font dependency — SVG favicons can't
       load web fonts in the browser tab). Colors mirror the @theme tokens:
       cream bg, warm-ink T, warm-red accent barcode. -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="11" fill="#f6f1e6" stroke="#e2d8c6" stroke-width="1.5"/>

  <!-- "T" — upright serif glyph, skewed for italic and recentred -->
  <g fill="#2a201a" transform="translate(4.4,0) skewX(-11)">
    <rect x="8" y="12.5" width="22" height="3.6"/>
    <rect x="8" y="12.5" width="2.8" height="6"/>
    <rect x="27.2" y="12.5" width="2.8" height="6"/>
    <rect x="17.4" y="12.5" width="3.4" height="22"/>
    <rect x="12" y="31.6" width="14" height="3.2"/>
  </g>

  <!-- barcode glyph — bottom-aligned bars, mirrors the wordmark ratios -->
  <g fill="#c2482f">
    <rect x="31.5" y="22.5" width="2.6" height="12" rx="0.5"/>
    <rect x="35" y="16.5" width="1.4" height="18" rx="0.5" opacity="0.8"/>
    <rect x="37.4" y="25.5" width="2.6" height="9" rx="0.5" opacity="0.6"/>
    <rect x="41" y="19.5" width="1.4" height="15" rx="0.5" opacity="0.9"/>
  </g>
</svg>
