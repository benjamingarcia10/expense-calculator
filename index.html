<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Brand placeholders are substituted at build/dev time by the
      `inject-brand` Vite plugin in vite.config.ts, reading from
      `src/lib/branding.ts`. -->
    <title>{{APP_FULL_TITLE}}</title>
    <meta
      name="description"
      content="Split bills with friends. Six split modes, no account needed, share via URL."
    />
    <meta property="og:title" content="{{APP_FULL_TITLE}}" />
    <meta
      property="og:description"
      content="Split bills with friends. Six split modes, no account needed, share via URL."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://benjamingarcia10.github.io/expense-calculator/" />
    <!-- A static branded preview card (generated by `scripts/generate-og.mjs`).
      The session-specific data in a #d=… share URL is in the hash fragment,
      which crawlers can't see — so previews show this card on every share. -->
    <meta property="og:image" content="https://benjamingarcia10.github.io/expense-calculator/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="{{APP_FULL_TITLE}} — a printed receipt showing a sample group split with grand total and settle-up payments."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{APP_FULL_TITLE}}" />
    <meta
      name="twitter:description"
      content="Split bills with friends. Six split modes, no account needed, share via URL."
    />
    <meta name="twitter:image" content="https://benjamingarcia10.github.io/expense-calculator/og-image.png" />
    <meta name="theme-color" content="#f5ecd9" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
